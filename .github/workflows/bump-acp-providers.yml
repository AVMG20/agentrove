name: Bump ACP Providers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  bump:
    name: Bump ACP Providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump pinned versions
        run: scripts/bump-acp-providers.sh

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          branch: bot/bump-acp-providers
          delete-branch: true
          commit-message: 'chore: bump ACP providers'
          title: 'chore: bump ACP providers'
          body: |
            Pins Claude Code, claude-agent-acp, codex-acp, Codex, Copilot, OpenCode, Cursor CLI, and Antigravity to their latest releases in `backend/Dockerfile`, `sandbox/docker/Dockerfile`, and `desktop/run_build.mjs`.

            Generated by `scripts/bump-acp-providers.sh`.
